# Overrides for @ActiveProfiles("test"): in-memory DB and safe defaults for CI / `mvn test`.
spring.datasource.url=jdbc:h2:mem:forge_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

app.seed.enabled=false

cloud.aws.s3.bucketName=test-bucket
cloud.aws.credential.accessKey=test
cloud.aws.credential.secretKey=test
cloud.aws.region=us-east-1

spring.rabbitmq.listener.simple.auto-startup=false

# Skip S3 log backfill during tests (StartupLoader).
app.audit.startup.days=0
