spring.application.name=forge

# Run database seed on startup (faculties, students, courses, assignments, rubrics, submissions, test suites).
# NOTE: With mvn spring-boot:run you must pass these as Spring Boot args, e.g.:
#   mvn spring-boot:run -Dspring-boot.run.arguments=\"--app.seed.enabled=true --app.seed.reset=true\"
# Example (no reset):
#   mvn spring-boot:run -Dspring-boot.run.arguments=\"--app.seed.enabled=true\"
# To also reset core teaching tables before seeding, add --app.seed.reset=true
 app.seed.enabled=true
# app.seed.reset=true

server.port=8080
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}


spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.data.jdbc.repositories.enabled=false


cloud.aws.s3.bucketName=${CLOUD_AWS_S3_BUCKET_NAME}
cloud.aws.credential.accessKey=${CLOUD_AWS_CREDENTIAL_ACCESS_KEY}
cloud.aws.credential.secretKey=${CLOUD_AWS_CREDENTIAL_SECRET_KEY}
cloud.aws.region=${CLOUD_AWS_REGION}

# Audit log lifecycle (America/Chicago)
app.audit.s3.prefix=${APP_AUDIT_S3_PREFIX:logs}
app.audit.rotation.cron=${APP_AUDIT_ROTATION_CRON:0 2 0 * * *}
app.audit.startup.days=${APP_AUDIT_STARTUP_DAYS:30}


spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=80MB
spring.servlet.multipart.max-request-size=80MB

# RabbitMQ (test run job queue). Override with env: SPRING_RABBITMQ_HOST, etc.
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
# Queue name for "run tests" jobs. Runner consumer uses the same name.
execution.queue.test-run-jobs=test-run-jobs
# Queue for grader-report jobs (similarity / AI report generation).
execution.queue.grader-report-jobs=grader-report-jobs

# Docker run-tests: resource limits for inner containers.
# If you want to run as a specific user, set run.tests.docker.user via environment (e.g. RUN_TESTS_DOCKER_USER=1000:1000).
# By default, Docker's image user (often root) is used.
# run.tests.docker.user=1000:1000
run.tests.docker.memory-mb=256
run.tests.docker.cpus=1
run.tests.docker.pids-limit=50

# Grader pipeline (for grader reports). grader.dir = path to grader/ directory (run.py, pipeline.py, etc.).
# When running `mvn spring-boot:run` from `Server/`, the repo root grader is at `../grader`.
# Override with env var GRADER_DIR (e.g. in Docker: /app/grader).
grader.dir=${GRADER_DIR:../grader}
# Command to run Python (python3 or python). Override with env var GRADER_PYTHON_CMD.
grader.python-cmd=${GRADER_PYTHON_CMD:python3}
# Directory for temp submission files and input.json; default system temp.
# grader.work-dir=${java.io.tmpdir}

# Grader report after-deadline scheduler. Runs every hour by default; set grader.report.deadline-schedule.enabled=false to disable.
grader.report.deadline-schedule.enabled=true
# Cron: default every hour at minute 0 (0 0 * * * ?). Use "0 0 2 * * ?" for daily at 2am.
# grader.report.deadline-schedule.cron=0 0 * * * ?

# LLM (Ollama) AI evidence signals for grader authorship triage. On by default.
# Set GRADER_LLM_AI_SIGNAL_ENABLED=false (or 0/no/off) to disable and skip Ollama calls.
grader.llm.ai-signal.enabled=${GRADER_LLM_AI_SIGNAL_ENABLED:true}
grader.llm.ai-signal.url=${GRADER_LLM_AI_SIGNAL_URL:http://localhost:11434/api/generate}
grader.llm.ai-signal.model=${GRADER_LLM_AI_SIGNAL_MODEL:llama3}
grader.llm.ai-signal.timeout-sec=${GRADER_LLM_AI_SIGNAL_TIMEOUT_SEC:30}

# Cost controls
grader.llm.ai-signal.max-files=${GRADER_LLM_AI_SIGNAL_MAX_FILES:5}
# 0 = no cap (every submission with readable code); positive = max LLM calls per report
grader.llm.ai-signal.max-students=${GRADER_LLM_AI_SIGNAL_MAX_STUDENTS:0}
grader.llm.ai-signal.max-chars-total=${GRADER_LLM_AI_SIGNAL_MAX_CHARS_TOTAL:9000}
grader.llm.ai-signal.max-chars-per-file=${GRADER_LLM_AI_SIGNAL_MAX_CHARS_PER_FILE:2500}

# Conservative inclusion/weighting
grader.llm.ai-signal.min-likeliness=${GRADER_LLM_AI_SIGNAL_MIN_LIKELINESS:0.45}
grader.llm.ai-signal.weight=${GRADER_LLM_AI_SIGNAL_WEIGHT:0.20}

# Faculty authorship triage labels (from DB) are passed in grader input.json; Python applies bounded score deltas before clamp.
# Disable adjustments only: set GRADER_FACULTY_TRIAGE_ENABLED=false in the Spring process env, or grader.faculty-triage.enabled=false below.
grader.faculty-triage.enabled=${GRADER_FACULTY_TRIAGE_ENABLED:true}
grader.faculty-triage.human-delta=-0.12
grader.faculty-triage.ai-delta=0.12
grader.faculty-triage.unclear-delta=0.03

# When ml.authorship-model.path points to a trained joblib, the grader loads it and adds a bounded RF adjustment to risk_score.
grader.authorship-ml.enabled=${GRADER_AUTHORSHIP_ML_ENABLED:true}
grader.authorship-ml.weight=${GRADER_AUTHORSHIP_ML_WEIGHT:0.12}

# Authorship ML model file: download (GET .../authorship-model) and train output (POST .../run-authorship-training/start).
# Default: ~/.grade-forge/authorship-model.joblib (dirs created on first train). Dockerfile sets ML_AUTHORSHIP_MODEL_PATH=/app/authorship-model.joblib.
ml.authorship-model.path=${ML_AUTHORSHIP_MODEL_PATH:${user.home}/.grade-forge/authorship-model.joblib}
# Directory containing train_authorship.py (and requirements-train.txt). Docker sets ML_TRAINING_DIR=/app/ml_training.
ml.training.dir=${ML_TRAINING_DIR:../ml_training}


#Email Service
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:username}
spring.mail.password=${SPRING_MAIL_PASSWORD:password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true


canvas.base-url=${CANVAS_BASE_URL:https://canvas.instructure.com}
canvas.token=${CANVAS_TOKEN}