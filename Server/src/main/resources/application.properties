spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=80MB
spring.servlet.multipart.max-request-size=80MB

# RabbitMQ (test run job queue). Override with env: SPRING_RABBITMQ_HOST, etc.
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
# Queue name for "run tests" jobs. Runner consumer uses the same name.
execution.queue.test-run-jobs=test-run-jobs
# Queue for grader-report jobs (similarity / AI report generation).
execution.queue.grader-report-jobs=grader-report-jobs

# Docker run-tests: resource limits for inner containers.
# If you want to run as a specific user, set run.tests.docker.user via environment (e.g. RUN_TESTS_DOCKER_USER=1000:1000).
# By default, Docker's image user (often root) is used.
# run.tests.docker.user=1000:1000
run.tests.docker.memory-mb=256
run.tests.docker.cpus=1
run.tests.docker.pids-limit=50

# Grader pipeline (for grader reports). grader.dir = path to grader/ directory (run.py, pipeline.py, etc.).
# Default "grader" is relative to working directory; in Docker set to absolute path e.g. /app/grader.
grader.dir=grader
# Command to run Python (python3 or python).
grader.python-cmd=python3
# Directory for temp submission files and input.json; default system temp.
# grader.work-dir=${java.io.tmpdir}

# Grader report after-deadline scheduler. Runs every hour by default; set grader.report.deadline-schedule.enabled=false to disable.
grader.report.deadline-schedule.enabled=true
# Cron: default every hour at minute 0 (0 0 * * * ?). Use "0 0 2 * * ?" for daily at 2am.
# grader.report.deadline-schedule.cron=0 0 * * * ?
