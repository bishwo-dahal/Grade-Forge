name: Docker Deployment for Grade Forge

on:
  push:
    branches:
      - main
      - production
    paths:
      - "Client/**"
      - "Server/**"
      - "docs-site/**"
      - "grader/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'main'
        type: choice
        options:
          - main
          - production
          - other
      deploy_as_main:
        description: 'Deploy this run on port 8080 (replace main container)'
        required: true
        default: false
        type: boolean
      branch_other:
        description: 'Branch name (when "other" is selected)'
        required: false
        default: ''
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Branch we're deploying: from manual input (or "other" -> custom name) or from the branch that was pushed
      DEPLOY_BRANCH: ${{ github.event_name == 'workflow_dispatch' && (inputs.branch == 'other' && inputs.branch_other || inputs.branch) || github.ref_name }}
      # Optional one-off: run this deployment on port 8080 (replace main container)
      DEPLOY_AS_MAIN: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_as_main || false }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ env.DEPLOY_BRANCH }}

    - name: Set deployment info
      run: |
        echo "Deploying branch: ${{ env.DEPLOY_BRANCH }}"
        echo "Image tag: bishwodahal/grade-forge:${{ env.DEPLOY_BRANCH }}"
        echo "Deploy as main (port 8080): ${{ env.DEPLOY_AS_MAIN }}"

    # Docker Hub login
    - name: Docker Login
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Build + push Docker image with registry cache (branch-specific tag)
    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: bishwodahal/grade-forge:${{ env.DEPLOY_BRANCH }}
        cache-from: type=registry,ref=bishwodahal/grade-forge:buildcache
        cache-to: type=registry,ref=bishwodahal/grade-forge:buildcache,mode=max

    # Deploy to EC2 (pull and run the branch-specific image, not :latest)
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ec2-user
        key: ${{ secrets.EC2_KEY }}
        script: |
          set -e
          IMAGE_TAG="${{ env.DEPLOY_BRANCH }}"
          echo "Pulling and deploying image: bishwodahal/grade-forge:${IMAGE_TAG}"
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
          docker pull bishwodahal/grade-forge:${IMAGE_TAG}
          if [ "${{ env.DEPLOY_AS_MAIN }}" = "true" ]; then
            CONTAINER_NAME="grade-forge-main"
            PORT=8080
          elif [ "${IMAGE_TAG}" = "main" ]; then
            CONTAINER_NAME="grade-forge-main"
            PORT=8080
          elif [ "${IMAGE_TAG}" = "production" ]; then
            CONTAINER_NAME="grade-forge-production"
            PORT=8081
          else
            CONTAINER_NAME="grade-forge-other"
            PORT=8989
          fi
          # Ensure RabbitMQ is running (avoid restart if already healthy)
          if docker ps --format '{{.Names}}' | grep -q '^gradeforge-rabbitmq$'; then
            echo "RabbitMQ container already running."
          else
            docker rm -f gradeforge-rabbitmq >/dev/null 2>&1 || true
            docker run -d \
              --name gradeforge-rabbitmq \
              -p 5672:5672 \
              -p 15672:15672 \
              -e RABBITMQ_DEFAULT_USER=guest \
              -e RABBITMQ_DEFAULT_PASS=guest \
              rabbitmq:3-management-alpine
          fi

          # Shared work directory for test runs (same absolute path on host and in container)
          WORK_DIR_BASE="/var/gradeforge/work"
          sudo mkdir -p "${WORK_DIR_BASE}"
          sudo chown "$(whoami)":"$(whoami)" "${WORK_DIR_BASE}"

          # If the container is already running the exact pulled image, skip restart.
          PULLED_IMAGE_ID="$(docker image inspect -f '{{.Id}}' bishwodahal/grade-forge:${IMAGE_TAG} 2>/dev/null || true)"
          RUNNING_IMAGE_ID="$(docker inspect -f '{{.Image}}' "${CONTAINER_NAME}" 2>/dev/null || true)"
          if [ -n "${PULLED_IMAGE_ID}" ] && [ "${PULLED_IMAGE_ID}" = "${RUNNING_IMAGE_ID}" ] && docker ps --format '{{.Names}}' | grep -q "^${CONTAINER_NAME}$"; then
            echo "No changes: ${CONTAINER_NAME} already running image ${IMAGE_TAG}. Skipping restart."
            exit 0
          fi

          docker stop "${CONTAINER_NAME}" >/dev/null 2>&1 || true
          docker rm "${CONTAINER_NAME}" >/dev/null 2>&1 || true

          # Required secrets (fail fast with a clear error instead of deploying a broken container)
          SPRING_DATASOURCE_URL_VAL="${{ secrets.SPRING_DATASOURCE_URL }}"
          SPRING_DATASOURCE_USERNAME_VAL="${{ secrets.SPRING_DATASOURCE_USERNAME }}"
          SPRING_DATASOURCE_PASSWORD_VAL="${{ secrets.SPRING_DATASOURCE_PASSWORD }}"
          CLOUD_AWS_S3_BUCKET_NAME_VAL="${{ secrets.CLOUD_AWS_S3_BUCKET_NAME }}"
          CLOUD_AWS_CREDENTIAL_ACCESS_KEY_VAL="${{ secrets.CLOUD_AWS_CREDENTIAL_ACCESS_KEY }}"
          CLOUD_AWS_CREDENTIAL_SECRET_KEY_VAL="${{ secrets.CLOUD_AWS_CREDENTIAL_SECRET_KEY }}"
          CLOUD_AWS_REGION_VAL="${{ secrets.CLOUD_AWS_REGION }}"

          missing_required=""
          if [ -z "${SPRING_DATASOURCE_URL_VAL}" ]; then missing_required="${missing_required} SPRING_DATASOURCE_URL"; fi
          if [ -z "${SPRING_DATASOURCE_USERNAME_VAL}" ]; then missing_required="${missing_required} SPRING_DATASOURCE_USERNAME"; fi
          if [ -z "${SPRING_DATASOURCE_PASSWORD_VAL}" ]; then missing_required="${missing_required} SPRING_DATASOURCE_PASSWORD"; fi
          if [ -z "${CLOUD_AWS_S3_BUCKET_NAME_VAL}" ]; then missing_required="${missing_required} CLOUD_AWS_S3_BUCKET_NAME"; fi
          if [ -z "${CLOUD_AWS_CREDENTIAL_ACCESS_KEY_VAL}" ]; then missing_required="${missing_required} CLOUD_AWS_CREDENTIAL_ACCESS_KEY"; fi
          if [ -z "${CLOUD_AWS_CREDENTIAL_SECRET_KEY_VAL}" ]; then missing_required="${missing_required} CLOUD_AWS_CREDENTIAL_SECRET_KEY"; fi
          if [ -z "${CLOUD_AWS_REGION_VAL}" ]; then missing_required="${missing_required} CLOUD_AWS_REGION"; fi
          if [ -n "${missing_required}" ]; then
            echo "ERROR: Missing required GitHub secrets for Docker deploy:${missing_required}"
            echo "Set these in GitHub repo settings → Secrets and variables → Actions."
            exit 1
          fi

          # Plagiarism & AI / Ollama (optional GitHub secrets — see SETUP.md "Production: GitHub Actions")
          GRADER_LLM_AI_SIGNAL_ENABLED_VAL="${{ secrets.GRADER_LLM_AI_SIGNAL_ENABLED }}"
          GRADER_LLM_AI_SIGNAL_URL_VAL="${{ secrets.GRADER_LLM_AI_SIGNAL_URL }}"
          GRADER_LLM_AI_SIGNAL_MODEL_VAL="${{ secrets.GRADER_LLM_AI_SIGNAL_MODEL }}"
          GRADER_LLM_AI_SIGNAL_TIMEOUT_SEC_VAL="${{ secrets.GRADER_LLM_AI_SIGNAL_TIMEOUT_SEC }}"
          GRADER_LLM_AI_SIGNAL_MAX_FILES_VAL="${{ secrets.GRADER_LLM_AI_SIGNAL_MAX_FILES }}"
          GRADER_LLM_AI_SIGNAL_MAX_STUDENTS_VAL="${{ secrets.GRADER_LLM_AI_SIGNAL_MAX_STUDENTS }}"
          GRADER_LLM_AI_SIGNAL_MAX_CHARS_TOTAL_VAL="${{ secrets.GRADER_LLM_AI_SIGNAL_MAX_CHARS_TOTAL }}"
          GRADER_LLM_AI_SIGNAL_MAX_CHARS_PER_FILE_VAL="${{ secrets.GRADER_LLM_AI_SIGNAL_MAX_CHARS_PER_FILE }}"
          GRADER_LLM_AI_SIGNAL_MIN_LIKELINESS_VAL="${{ secrets.GRADER_LLM_AI_SIGNAL_MIN_LIKELINESS }}"
          GRADER_LLM_AI_SIGNAL_WEIGHT_VAL="${{ secrets.GRADER_LLM_AI_SIGNAL_WEIGHT }}"
          if [ -z "${GRADER_LLM_AI_SIGNAL_ENABLED_VAL}" ]; then GRADER_LLM_AI_SIGNAL_ENABLED_VAL="false"; fi
          if [ -z "${GRADER_LLM_AI_SIGNAL_URL_VAL}" ]; then GRADER_LLM_AI_SIGNAL_URL_VAL="http://host.docker.internal:11434/api/generate"; fi
          if [ -z "${GRADER_LLM_AI_SIGNAL_MODEL_VAL}" ]; then GRADER_LLM_AI_SIGNAL_MODEL_VAL="llama3"; fi
          if [ -z "${GRADER_LLM_AI_SIGNAL_TIMEOUT_SEC_VAL}" ]; then GRADER_LLM_AI_SIGNAL_TIMEOUT_SEC_VAL="120"; fi
          if [ -z "${GRADER_LLM_AI_SIGNAL_MAX_FILES_VAL}" ]; then GRADER_LLM_AI_SIGNAL_MAX_FILES_VAL="5"; fi
          if [ -z "${GRADER_LLM_AI_SIGNAL_MAX_STUDENTS_VAL}" ]; then GRADER_LLM_AI_SIGNAL_MAX_STUDENTS_VAL="0"; fi
          if [ -z "${GRADER_LLM_AI_SIGNAL_MAX_CHARS_TOTAL_VAL}" ]; then GRADER_LLM_AI_SIGNAL_MAX_CHARS_TOTAL_VAL="9000"; fi
          if [ -z "${GRADER_LLM_AI_SIGNAL_MAX_CHARS_PER_FILE_VAL}" ]; then GRADER_LLM_AI_SIGNAL_MAX_CHARS_PER_FILE_VAL="2500"; fi
          if [ -z "${GRADER_LLM_AI_SIGNAL_MIN_LIKELINESS_VAL}" ]; then GRADER_LLM_AI_SIGNAL_MIN_LIKELINESS_VAL="0.45"; fi
          if [ -z "${GRADER_LLM_AI_SIGNAL_WEIGHT_VAL}" ]; then GRADER_LLM_AI_SIGNAL_WEIGHT_VAL="0.20"; fi

          # Email (optional). If not set, app uses defaults from application.properties.
          # Must pass each -e as a single quoted argv (bash array); unquoted concatenation breaks when
          # values contain spaces or substrings Docker mistakes for an image name (e.g. "... rrcg ...").
          SPRING_MAIL_HOST_VAL="${{ secrets.SPRING_MAIL_HOST }}"
          SPRING_MAIL_PORT_VAL="${{ secrets.SPRING_MAIL_PORT }}"
          SPRING_MAIL_USERNAME_VAL="${{ secrets.SPRING_MAIL_USERNAME }}"
          SPRING_MAIL_PASSWORD_VAL="${{ secrets.SPRING_MAIL_PASSWORD }}"

          run_args=(
            -d
            -p "${PORT}:8080"
            --add-host=host.docker.internal:host-gateway
            -v "${WORK_DIR_BASE}:/var/gradeforge/work"
            -v /var/run/docker.sock:/var/run/docker.sock
            -e SPRING_RABBITMQ_HOST=host.docker.internal
            -e "RUN_TESTS_WORK_DIR_BASE=/var/gradeforge/work"
            -e "SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL_VAL}"
            -e "SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME_VAL}"
            -e "SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD_VAL}"
            -e "CLOUD_AWS_S3_BUCKET_NAME=${CLOUD_AWS_S3_BUCKET_NAME_VAL}"
            -e "CLOUD_AWS_CREDENTIAL_ACCESS_KEY=${CLOUD_AWS_CREDENTIAL_ACCESS_KEY_VAL}"
            -e "CLOUD_AWS_CREDENTIAL_SECRET_KEY=${CLOUD_AWS_CREDENTIAL_SECRET_KEY_VAL}"
            -e "CLOUD_AWS_REGION=${CLOUD_AWS_REGION_VAL}"
            -e "GRADER_LLM_AI_SIGNAL_ENABLED=${GRADER_LLM_AI_SIGNAL_ENABLED_VAL}"
            -e "GRADER_LLM_AI_SIGNAL_URL=${GRADER_LLM_AI_SIGNAL_URL_VAL}"
            -e "GRADER_LLM_AI_SIGNAL_MODEL=${GRADER_LLM_AI_SIGNAL_MODEL_VAL}"
            -e "GRADER_LLM_AI_SIGNAL_TIMEOUT_SEC=${GRADER_LLM_AI_SIGNAL_TIMEOUT_SEC_VAL}"
            -e "GRADER_LLM_AI_SIGNAL_MAX_FILES=${GRADER_LLM_AI_SIGNAL_MAX_FILES_VAL}"
            -e "GRADER_LLM_AI_SIGNAL_MAX_STUDENTS=${GRADER_LLM_AI_SIGNAL_MAX_STUDENTS_VAL}"
            -e "GRADER_LLM_AI_SIGNAL_MAX_CHARS_TOTAL=${GRADER_LLM_AI_SIGNAL_MAX_CHARS_TOTAL_VAL}"
            -e "GRADER_LLM_AI_SIGNAL_MAX_CHARS_PER_FILE=${GRADER_LLM_AI_SIGNAL_MAX_CHARS_PER_FILE_VAL}"
            -e "GRADER_LLM_AI_SIGNAL_MIN_LIKELINESS=${GRADER_LLM_AI_SIGNAL_MIN_LIKELINESS_VAL}"
            -e "GRADER_LLM_AI_SIGNAL_WEIGHT=${GRADER_LLM_AI_SIGNAL_WEIGHT_VAL}"
          )
          [ -n "${SPRING_MAIL_HOST_VAL}" ] && run_args+=( -e "SPRING_MAIL_HOST=${SPRING_MAIL_HOST_VAL}" )
          [ -n "${SPRING_MAIL_PORT_VAL}" ] && run_args+=( -e "SPRING_MAIL_PORT=${SPRING_MAIL_PORT_VAL}" )
          [ -n "${SPRING_MAIL_USERNAME_VAL}" ] && run_args+=( -e "SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME_VAL}" )
          [ -n "${SPRING_MAIL_PASSWORD_VAL}" ] && run_args+=( -e "SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD_VAL}" )

          docker run "${run_args[@]}" --name "${CONTAINER_NAME}" "bishwodahal/grade-forge:${IMAGE_TAG}"
          echo "Deployed bishwodahal/grade-forge:${IMAGE_TAG} on port ${PORT} (container: ${CONTAINER_NAME})"
 