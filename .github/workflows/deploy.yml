name: Docker Deployment for Grade Forge

on:
  push:
    branches:
      - main
      - production
      - bishwodahal_fixing_deployment

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    # Build Docker image
    - name: Build Docker image
      run: docker build -t bishwodahal/grade-forge:latest .

    # Docker Hub login
    - name: Docker Login
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # Push Docker image to Docker Hub
    - name: Push Docker image
      run: docker push bishwodahal/grade-forge:latest

    # Deploy to EC2
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ec2-user
        key: ${{ secrets.EC2_KEY }}
        script: |
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
          docker pull bishwodahal/grade-forge:latest
          if [ "${{ github.ref_name }}" = "bishwodahal_fixing_deployment" ]; then
            # Main branch deployment
            docker stop grade-forge-main || true
            docker rm grade-forge-main || true
            docker run -d -p 8080:8080 --name grade-forge-main bishwodahal/grade-forge:latest
          elif [ "${{ github.ref_name }}" = "production" ]; then
            # Production branch deployment
            docker stop grade-forge-production || true
            docker rm grade-forge-production || true
            docker run -d -p 8081:8080 --name grade-forge-production bishwodahal/grade-forge:latest
          fi
 