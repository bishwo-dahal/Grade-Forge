name: Docker Deployment for Grade Forge

on:
  push:
    branches:
      - main
      - production
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'main'
        type: choice
        options:
          - main
          - production
          - other
      branch_other:
        description: 'Branch name (when "other" is selected)'
        required: false
        default: ''
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Branch we're deploying: from manual input (or "other" -> custom name) or from the branch that was pushed
      DEPLOY_BRANCH: ${{ github.event_name == 'workflow_dispatch' && (inputs.branch == 'other' && inputs.branch_other || inputs.branch) || github.ref_name }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        ref: ${{ env.DEPLOY_BRANCH }}

    - name: Set deployment info
      run: |
        echo "Deploying branch: ${{ env.DEPLOY_BRANCH }}"
        echo "Image tag: bishwodahal/grade-forge:${{ env.DEPLOY_BRANCH }}"

    # Build Docker image (tagged by branch so main and production never overwrite each other)
    - name: Build Docker image
      run: docker build -t bishwodahal/grade-forge:${{ env.DEPLOY_BRANCH }} .

    # Docker Hub login
    - name: Docker Login
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # Push Docker image (branch-specific tag)
    - name: Push Docker image
      run: docker push bishwodahal/grade-forge:${{ env.DEPLOY_BRANCH }}

    # Deploy to EC2 (pull and run the branch-specific image, not :latest)
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ec2-user
        key: ${{ secrets.EC2_KEY }}
        script: |
          set -e
          IMAGE_TAG="${{ env.DEPLOY_BRANCH }}"
          echo "Pulling and deploying image: bishwodahal/grade-forge:${IMAGE_TAG}"
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
          docker pull bishwodahal/grade-forge:${IMAGE_TAG}
          if [ "${IMAGE_TAG}" = "main" ]; then
            CONTAINER_NAME="grade-forge-main"
            PORT=8080
          elif [ "${IMAGE_TAG}" = "production" ]; then
            CONTAINER_NAME="grade-forge-production"
            PORT=8081
          else
            CONTAINER_NAME="grade-forge-other"
            PORT=8989
          fi
          # Ensure RabbitMQ is running (replace any existing instance)
          docker stop gradeforge-rabbitmq || true
          docker rm gradeforge-rabbitmq || true
          docker run -d \
            --name gradeforge-rabbitmq \
            -p 5672:5672 \
            -p 15672:15672 \
            -e RABBITMQ_DEFAULT_USER=guest \
            -e RABBITMQ_DEFAULT_PASS=guest \
            rabbitmq:3-management-alpine

          # Shared work directory for test runs (same absolute path on host and in container)
          WORK_DIR_BASE="/var/gradeforge/work"
          sudo mkdir -p "${WORK_DIR_BASE}"
          sudo chown "$(whoami)":"$(whoami)" "${WORK_DIR_BASE}"
          docker stop "${CONTAINER_NAME}" || true
          docker rm "${CONTAINER_NAME}" || true
          docker run -d \
            -p ${PORT}:8080 \
            --add-host=host.docker.internal:host-gateway \
            -v "${WORK_DIR_BASE}:/var/gradeforge/work" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e SPRING_RABBITMQ_HOST=host.docker.internal \
            -e RUN_TESTS_WORK_DIR_BASE=/var/gradeforge/work \
            -e SPRING_DATASOURCE_URL="${{ secrets.SPRING_DATASOURCE_URL }}" \
            -e SPRING_DATASOURCE_USERNAME="${{ secrets.SPRING_DATASOURCE_USERNAME }}" \
            -e SPRING_DATASOURCE_PASSWORD="${{ secrets.SPRING_DATASOURCE_PASSWORD }}" \
            -e CLOUD_AWS_S3_BUCKET_NAME="${{ secrets.CLOUD_AWS_S3_BUCKET_NAME }}" \
            -e CLOUD_AWS_CREDENTIAL_ACCESS_KEY="${{ secrets.CLOUD_AWS_CREDENTIAL_ACCESS_KEY }}" \
            -e CLOUD_AWS_CREDENTIAL_SECRET_KEY="${{ secrets.CLOUD_AWS_CREDENTIAL_SECRET_KEY }}" \
            -e CLOUD_AWS_REGION="${{ secrets.CLOUD_AWS_REGION }}" \
            --name "${CONTAINER_NAME}" \
            bishwodahal/grade-forge:${IMAGE_TAG}
          echo "Deployed bishwodahal/grade-forge:${IMAGE_TAG} on port ${PORT} (container: ${CONTAINER_NAME})"
 